      name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Base
        run: |
          flutter create --org com.truckerpark.app app_temp
          cp -r app_temp/* .
          cp -r app_temp/.[!.]* . 2>/dev/null || true
          rm -rf app_temp

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TruckerPark-App
          path: build/app/outputs/flutter-apk/app-debug.apk
          
