name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Skeleton and Build
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.truckerpark.app app
          cd app
          cp -f ../../lib/main.dart lib/main.dart
          flutter build apk --debug
          mkdir -p ../../output
          cp build/app/outputs/flutter-apk/app-debug.apk ../../output/TruckerPark.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TruckerPark-App
          path: output/TruckerPark.apk
          
